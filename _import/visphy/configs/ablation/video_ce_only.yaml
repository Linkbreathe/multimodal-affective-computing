# Ablation: video encoder only, CE loss only.
# Usage:
#   conda run -n visphy python scripts/run_experiment_10s.py \
#     --fusion_config configs/ablation/video_ce_only.yaml \
#     --name ablation_video_ce_only
fusion_type: early

modalities:
  video:
    encoder: VideoMAEV2
    embed_dim: 768
    enabled: true
  eye_tracking:
    encoder: PatchTST
    embed_dim: 128
    enabled: false
  ppg:
    encoder: Papagei
    embed_dim: 512
    enabled: false

loss_weights:
  ce: 1.0
  kl: 0.0
  vad: 0.0
