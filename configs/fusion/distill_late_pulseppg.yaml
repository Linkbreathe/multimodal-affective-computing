fusion_type: distill_late
fusion:
  d_common: 256
  dropout: 0.1
  distill:
    tau: 3.0
    lambda_distill: 1.0
    num_classes: 9
    enriched_modalities: ["ppg", "eye_tracking"]
    teacher_modality: "video"
modalities:
  ppg:
    encoder: pulseppg
    embed_dim: 512
    enabled: true
training:
  lr: 0.0001
  max_epochs: 100
