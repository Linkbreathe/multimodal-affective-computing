seed: 42

data_dir: "data/seedv_preprocessed"
embeddings_dir: "data/embeddings_seedv"
ref_data_dir: "/mnt/c/Users/Public/Data/SEED-V/SEED-V"

eegpt_weights: "weights/eegpt/eegpt_mcae_58chs_4s_large4E.ckpt"

modalities:
  eeg:
    encoder: EEGPT
    embed_dim: 2048
    enabled: true

fusion:
  type: early
  d_common: 256
  dropout: 0.1

training:
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.01
  max_epochs: 100
  patience: 10
  num_workers: 4

num_classes: 5
emotions:
  - Disgust
  - Fear
  - Sad
  - Neutral
  - Happy

eval:
  primary_metric: "weighted_f1"
  loso: true
