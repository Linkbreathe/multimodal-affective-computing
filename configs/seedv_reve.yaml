seed: 42

data_dir: "data/seedv_preprocessed_uv"
embeddings_dir: "data/embeddings_seedv_uv"
ref_data_dir: "/mnt/c/Users/Public/Data/SEED-V/SEED-V"

reve_weights: "weights/reve/reve_base.safetensors"
reve_pos_bank: "weights/reve/reve_positions.safetensors"

modalities:
  eeg:
    encoder: REVE
    embed_dim: 512
    enabled: true

fusion:
  type: early
  d_common: 256
  dropout: 0.1

training:
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.01
  max_epochs: 100
  patience: 10
  num_workers: 4

num_classes: 5
emotions:
  - Disgust
  - Fear
  - Sad
  - Neutral
  - Happy

eval:
  primary_metric: "balanced_accuracy"
  loso: true
