[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac"
version = "0.1.0"
description = "Multimodal affective computing: visual-physiological fusion research and real-time relaxation inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # Shared core: session ingest, handcrafted features, classical models,
  # cached-embedding evaluation. Deliberately free of torch so the classical
  # workflow and the data-independent tests install without a GPU stack.
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "pyxdf>=1.16,<2",
  "mne>=1.6,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  # opencv-python, NOT opencv-python-headless: both ship cv2 and cannot be
  # installed together. The merged tree needs the full build for video work.
  "opencv-python>=4.9,<5",
  "pylsl>=1.16,<2",
]

[project.optional-dependencies]
ecg = ["neurokit2>=0.2.7,<1"]
head = ["ahrs>=0.3.1,<1"]
dcnn = ["torch>=2.7,<3"]
clip = ["torch>=2.1", "transformers>=4.38"]
# Pretrained-encoder and fusion stack (EEGPT, REVE, PaPaGei, VideoMAE v2, ...)
dl = [
  "torch>=2.7,<3",
  "torchvision>=0.20",
  "torchaudio>=2.7",
  "einops>=0.8,<1",
  "transformers>=4.38",
  "huggingface-hub>=0.26",
  "safetensors>=0.4",
  "timm>=1.0,<2",
  "h5py>=3.10",
]
viz = ["matplotlib>=3.8,<4", "seaborn>=0.13,<1", "tqdm>=4.66,<5", "tensorboard>=2.16,<3"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]

[project.scripts]
mac = "mac.cli:main"
# Pre-merge alias; scheduled for removal with the src/real_time_ml shims.
rtml = "mac.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# mac is the real package; real_time_ml and src are generated compatibility
# shims that alias into it (see docs/MERGE-MAP.md).
include = ["mac*", "real_time_ml*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: reads participant source data",
  "slow: full-data or model training test",
  "external: requires pretrained weights, external model code or real participant data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
